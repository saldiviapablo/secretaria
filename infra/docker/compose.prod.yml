# ==============================================================================
# SVIA - SECRETARIA VIRTUAL CON IA
# DOCKER COMPOSE TEMPLATE — PRODUCTION (NAS / HOMELAB)
# ==============================================================================
# Note: Versioned template for PROD. Do not execute directly in DEV.
# ==============================================================================

services:
  n8n-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: secretaria-n8n-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - n8n_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  docx-extractor:
    image: ${DOCX_EXTRACTOR_IMAGE:-svia-docx-extractor:prod}
    container_name: secretaria-docx-extractor-prod
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - svia_doc_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()\""]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.35.4}
    container_name: secretaria-n8n-prod
    restart: unless-stopped
    ports:
      - "${N8N_LAN_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=100000
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=true
      - N8N_COMMUNITY_PACKAGES_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
    volumes:
      - n8n_prod_data:/home/node/.n8n
    networks:
      - n8n_internal_network
      - svia_doc_internal
    depends_on:
      n8n-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  n8n_internal_network:
    driver: bridge
    internal: false
  svia_doc_internal:
    driver: bridge
    internal: true

volumes:
  n8n_postgres_prod_data:
  n8n_prod_data:
