services:
  n8n-postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: secretaria-n8n-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_dev_password}
    volumes:
      - n8n_postgres_dev_data:/var/lib/postgresql/data
    networks:
      - n8n_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No port mapping: Postgres is strictly isolated within the internal Docker network.

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.33.3}
    container_name: secretaria-n8n-dev
    restart: unless-stopped
    ports:
      - "${N8N_LAN_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n_dev_password}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n_dev_dummy_encryption_key_32b!}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Buenos_Aires}
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
    volumes:
      - n8n_dev_data:/home/node/.n8n
    networks:
      - n8n_internal_network
    depends_on:
      n8n-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  n8n_internal_network:
    driver: bridge
    internal: false

volumes:
  n8n_postgres_dev_data:
  n8n_dev_data:
