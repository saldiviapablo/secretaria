[project]
name = "svia-docx-extractor"
version = "1.0.0"
description = "Deterministic and secure DOCX extraction sidecar"
authors = [{ name = "Secretaria Virtual con IA" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
    "python-docx==1.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
